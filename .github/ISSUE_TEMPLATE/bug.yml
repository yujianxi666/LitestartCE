name: 错误问题反馈 Bug Report
description: 反馈遇到的问题 Feedback the encountered issues
labels: ["Bug"]
assignees: "yujianxi666"

body:
  - type: markdown
    attributes:
      value: |
        仅仅反馈所遇到的一个使用问题，多个请重新提交另外的 issue
        Only give feedback on one usage problem encountered, please resubmit another issue

  - type: checkboxes
    attributes:
      label: 在反馈此问题前请注意 Please note before reporting this issue
      description: 在提交此反馈前请确认以下内容 Please confirm the following items before submitting this feedback
      options:
        - label: 已经查看相关帮助内容 Read more about the Salt Player help content
          required: true
        - label: 已经在本仓库搜索相关内容（避免重复反馈）Already searched for related content in this repository (to avoid duplicate feedback)
          required: true
        - label: 确认仅将提交**一个**问题（多个问题或者备注提及另外的问题请重新提交新的）Confirm to submit only one issue (if multiple issues or notes mention other issues, please submit a new one separately)
          required: true


  - type: input
    attributes:
      label: 浏览器 Browser
      description: 你所使用的浏览器 The browser ur using
    validations:
      required: false
      
  - type: input
    attributes:
      label: 系统 System 
      description: 系统以及系统版本 System and version
    validations:
      required: false

  - type: input
    attributes:
      label: LitestartCE版本 LitestartCE Version
    validations:
      required: false

  - type: textarea
    attributes:
      label: 问题描述 | Bug Description
      description: |
        请尽可能地详细描述你所遇到的问题，并描述如何重新触发这个问题。
        Please describe the bug you met in as much detail as possible. Additionally, describe the steps to reproduce this bug.
      placeholder: 在此输入遇到的问题，必填 Enter the issue encountered here, Required
    validations:
      required: false
